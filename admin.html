<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin · Entradas Graduación</title>
  <link rel="stylesheet" href="style.css" />
  <meta name="theme-color" content="#0f172a" />
</head>
<body>

<!-- ======== LOGIN ======== -->
<section id="vista-login" class="container" style="padding-top: 3rem;">
  <div class="card" style="text-align:center;">

    <!-- LOGO EN LOGIN -->
    <img src="blancalogo.png" alt="Logo IES Blanca Fernández Ochoa"
         style="width:100px; margin: 0 auto 1rem auto; display:block; border-radius:12px;" />

    <h1>Acceso administrador</h1>
    <p class="muted" style="margin-bottom:1rem;">Introduce tus credenciales para gestionar las entradas.</p>
    <form id="form-login" style="text-align:left;">
      <label for="email">Correo electrónico</label>
      <input id="email" type="email" autocomplete="username" required />
      <label for="password">Contraseña</label>
      <input id="password" type="password" autocomplete="current-password" required />
      <button class="btn btn-block" type="submit">Entrar</button>
      <p id="login-error" class="muted" style="color:#f87171; margin-top:0.75rem;"></p>
    </form>
    <p class="muted" style="margin-top:1rem; text-align:center;">
      <a href="index.html">&larr; Volver</a>
    </p>
  </div>
</section>

<!-- ======== PANEL ADMIN ======== -->
<section id="vista-admin" class="hidden">
  <header class="topbar">
    <!-- LOGO EN TOPBAR -->
    <div style="display:flex; align-items:center; gap:0.75rem;">
      <img src="blancalogo.png" alt="Logo" style="height:36px; border-radius:6px;" />
      <h1 id="evento-titulo" style="margin:0;">Admin &middot; Entradas</h1>
    </div>
    <span><span id="user-email" class="user"></span> &middot; <a href="#" id="btn-logout">Salir</a></span>
  </header>

  <div class="container">

    <!-- Estadísticas -->
    <div class="stats">
      <div class="stat"><div class="num" id="stat-total">0</div><div class="lbl">Total</div></div>
      <div class="stat"><div class="num" id="stat-disponibles" style="color:#34d399;">0</div><div class="lbl">Disponibles</div></div>
      <div class="stat"><div class="num" id="stat-usadas" style="color:#f87171;">0</div><div class="lbl">Usadas</div></div>
    </div>

    <!-- Crear entradas -->
    <div class="card">
      <h2>Crear nuevas entradas</h2>
      <div class="toolbar">
        <input id="cantidad" type="number" min="1" max="2000" value="10" style="margin-bottom:0;" />
        <button id="btn-crear" class="btn">Crear N entradas</button>
      </div>
      <p class="muted">Se generan códigos únicos del tipo <code>ENT-XXXXXX</code> con numeración correlativa.</p>
    </div>

    <!-- Acciones masivas -->
    <div class="card">
      <h2>Acciones</h2>
      <div class="toolbar">
        <button id="btn-pdf" class="btn btn-success">&#x1F4C4; Descargar PDF imprimible</button>
        <button id="btn-resetear" class="btn btn-secondary">&circlearrowleft; Marcar todas como NO usadas</button>
        <button id="btn-borrar-todo" class="btn btn-danger">&#x1F5D1; Borrar TODAS las entradas</button>
      </div>
    </div>

    <!-- Lista -->
    <div class="card">
      <h2>Entradas (<span id="lista-count">0</span>)</h2>
      <div class="toolbar">
        <input id="filtro" type="text" placeholder="Filtrar por código o número..." style="margin-bottom:0;" />
      </div>
      <div id="lista" class="list"></div>
    </div>

  </div>
</section>

<!-- ======== Bibliotecas ======== -->
<script src="config.js"></script>
<!-- Firebase v10 modular vía import -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFirestore, collection, doc, getDocs, setDoc, deleteDoc, updateDoc,
    onSnapshot, query, orderBy, writeBatch
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const app  = initializeApp(window.firebaseConfig);
  const auth = getAuth(app);
  const db   = getFirestore(app);
  const col  = collection(db, "entradas");

  // ----------- Helpers UI -----------
  const $ = (id) => document.getElementById(id);
  const show = (el) => el.classList.remove('hidden');
  const hide = (el) => el.classList.add('hidden');

  if (window.NOMBRE_EVENTO) $("evento-titulo").textContent = window.NOMBRE_EVENTO;

  // ----------- Login -----------
  $("form-login").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("login-error").textContent = "";
    try {
      await signInWithEmailAndPassword(auth, $("email").value.trim(), $("password").value);
    } catch (err) {
      $("login-error").textContent = "Credenciales incorrectas o usuario no autorizado.";
      console.error(err);
    }
  });

  $("btn-logout").addEventListener("click", (e) => {
    e.preventDefault();
    signOut(auth);
  });

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      const adminEmail = (window.ADMIN_EMAIL || "").toLowerCase();
      const userEmail  = (user.email || "").toLowerCase();
      if (adminEmail && userEmail !== adminEmail) {
        hide($("vista-admin"));
        show($("vista-login"));
        $("login-error").innerHTML =
          'Esta cuenta no tiene permisos de administración.<br>' +
          'Si vienes a escanear, usa la <a href="scan.html">página del escáner</a>.';
        await signOut(auth);
        return;
      }
      hide($("vista-login"));
      show($("vista-admin"));
      $("user-email").textContent = user.email;
      iniciarListener();
    } else {
      hide($("vista-admin"));
      show($("vista-login"));
    }
  });

  // ----------- Generación de códigos -----------
  function generarCodigo() {
    const chars = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
    let c = "ENT-";
    for (let i = 0; i < 6; i++) c += chars[Math.floor(Math.random() * chars.length)];
    return c;
  }

  // ----------- Lectura en tiempo real -----------
  let entradasCache = [];
  function iniciarListener() {
    const q = query(col, orderBy("creada", "desc"));
    onSnapshot(q, (snap) => {
      entradasCache = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      pintarLista();
      pintarStats();
    });
  }

  function pintarStats() {
    const total = entradasCache.length;
    const usadas = entradasCache.filter(e => e.usada).length;
    $("stat-total").textContent = total;
    $("stat-usadas").textContent = usadas;
    $("stat-disponibles").textContent = total - usadas;
  }

  function pintarLista() {
    const filtro = $("filtro").value.trim().toUpperCase();
    const lista = entradasCache
      .filter(e => {
        if (!filtro) return true;
        const matchCodigo = e.id.includes(filtro);
        const matchNumero = e.numero && e.numero.toString().includes(filtro);
        return matchCodigo || matchNumero;
      })
      .sort((a, b) => (a.numero || 0) - (b.numero || 0));

    $("lista-count").textContent = lista.length;
    $("lista").innerHTML = lista.map(e => `
      <div class="list-item">
        <span class="codigo">
          ${e.numero ? '<strong>#' + e.numero + '</strong> &middot; ' : ''}${e.id}
        </span>
        <span class="${e.usada ? 'badge badge-used' : 'badge badge-ok'}">
          ${e.usada ? 'Usada' : 'Disponible'}
        </span>
        <span style="display:flex; gap:0.25rem;">
          <button class="btn btn-secondary" data-toggle="${e.id}" style="padding:0.4rem 0.6rem; font-size:0.8rem;">
            ${e.usada ? 'Reactivar' : 'Marcar usada'}
          </button>
          <button class="btn btn-danger" data-del="${e.id}" style="padding:0.4rem 0.6rem; font-size:0.8rem;">&times;</button>
        </span>
      </div>
    `).join("");

    $("lista").querySelectorAll("[data-toggle]").forEach(btn => {
      btn.onclick = async () => {
        const id = btn.dataset.toggle;
        const ent = entradasCache.find(e => e.id === id);
        await updateDoc(doc(col, id), {
          usada: !ent.usada,
          usadaEn: !ent.usada ? new Date().toISOString() : null
        });
      };
    });
    $("lista").querySelectorAll("[data-del]").forEach(btn => {
      btn.onclick = async () => {
        if (!confirm(`¿Borrar la entrada ${btn.dataset.del}?`)) return;
        await deleteDoc(doc(col, btn.dataset.del));
      };
    });
  }

  $("filtro").addEventListener("input", pintarLista);

  // =================================================================
  //  Crear N entradas (numeración correlativa + control de lotes)
  // =================================================================
  $("btn-crear").addEventListener("click", async () => {
    const n = parseInt($("cantidad").value, 10);
    if (!n || n < 1) return alert("Indica un número válido.");
    if (n > 2000) return alert("Máximo 2000 por lote.");

    $("btn-crear").disabled = true;
    $("btn-crear").textContent = "Creando...";
    try {
      const existentes = new Set(entradasCache.map(e => e.id));

      // ★ Calcular el número más alto que ya existe
      let maxNumero = 0;
      entradasCache.forEach(e => {
        if (e.numero && e.numero > maxNumero) maxNumero = e.numero;
      });

      // ★ Preparar todas las entradas antes de enviar
      const nuevas = [];
      while (nuevas.length < n) {
        const codigo = generarCodigo();
        if (existentes.has(codigo)) continue;
        existentes.add(codigo);
        nuevas.push({
          codigo,
          data: {
            usada: false,
            usadaEn: null,
            numero: maxNumero + nuevas.length + 1,
            creada: new Date().toISOString()
          }
        });
      }

      // ★ Dividir en lotes de 500 (límite de Firestore writeBatch)
      const BATCH_SIZE = 500;
      for (let i = 0; i < nuevas.length; i += BATCH_SIZE) {
        const trozo = nuevas.slice(i, i + BATCH_SIZE);
        const batch = writeBatch(db);
        trozo.forEach(e => batch.set(doc(col, e.codigo), e.data));
        await batch.commit();
        $("btn-crear").textContent = `Creando... ${Math.min(i + BATCH_SIZE, nuevas.length)}/${n}`;
      }

    } catch (err) {
      alert("Error al crear: " + err.message);
      console.error(err);
    } finally {
      $("btn-crear").disabled = false;
      $("btn-crear").textContent = "Crear N entradas";
    }
  });

  // =================================================================
  //  Borrar todo (también con control de lotes)
  // =================================================================
  $("btn-borrar-todo").addEventListener("click", async () => {
    if (!confirm(`¿Seguro que quieres borrar TODAS las ${entradasCache.length} entradas? Esta acción no se puede deshacer.`)) return;
    if (!confirm("Última confirmación. ¿Borrar todas las entradas?")) return;

    const BATCH_SIZE = 500;
    for (let i = 0; i < entradasCache.length; i += BATCH_SIZE) {
      const trozo = entradasCache.slice(i, i + BATCH_SIZE);
      const batch = writeBatch(db);
      trozo.forEach(e => batch.delete(doc(col, e.id)));
      await batch.commit();
    }
  });

  // =================================================================
  //  Resetear — todas a no usada (también con control de lotes)
  // =================================================================
  $("btn-resetear").addEventListener("click", async () => {
    if (!confirm("¿Marcar TODAS las entradas como NO usadas? Útil si has hecho una prueba.")) return;

    const BATCH_SIZE = 500;
    for (let i = 0; i < entradasCache.length; i += BATCH_SIZE) {
      const trozo = entradasCache.slice(i, i + BATCH_SIZE);
      const batch = writeBatch(db);
      trozo.forEach(e => batch.update(doc(col, e.id), { usada: false, usadaEn: null }));
      await batch.commit();
    }
  });

  // ============================================================
  //  GENERAR PDF: 10 entradas por página A4 (2 col × 5 filas)
  // ============================================================
  $("btn-pdf").addEventListener("click", async () => {
    if (entradasCache.length === 0) return alert("No hay entradas para imprimir.");
    $("btn-pdf").disabled = true;
    $("btn-pdf").textContent = "Generando PDF...";

    try {
      await cargarScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
      await cargarScript("https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js");

      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ unit: "mm", format: "a4", orientation: "portrait" });

      const evento = window.NOMBRE_EVENTO || "Graduación";

      // --- Cargar logo para el PDF desde blancalogo.png ---
      let logoData = null;
      if (window.LOGO_BASE64) {
        const img = new Image();
        await new Promise((res, rej) => {
          img.onload = res;
          img.onerror = rej;
          img.src = window.LOGO_BASE64;
        });
        logoData = { dataURL: window.LOGO_BASE64, w: img.naturalWidth, h: img.naturalHeight };
      } else {
        const logoURL = window.LOGO_URL || "blancalogo.png";
        logoData = await cargarLogoComoDataURL(logoURL);
      }

      // --- Medidas de la cuadrícula ---
      const pageW = 210, pageH = 297;
      const margin = 8;
      const cols = 2, rows = 5;
      const cellW = (pageW - 2 * margin) / cols;
      const cellH = (pageH - 2 * margin) / rows;
      const pad = 3;

      // ★ Ordenar por número correlativo
      const ordenadas = [...entradasCache].sort((a, b) => (a.numero || 0) - (b.numero || 0));
      const perPage = cols * rows;

      for (let i = 0; i < ordenadas.length; i++) {
        if (i > 0 && i % perPage === 0) pdf.addPage();

        const idx = i % perPage;
        const c = idx % cols;
        const r = Math.floor(idx / cols);
        const x = margin + c * cellW;
        const y = margin + r * cellH;

        await dibujarCeldaEntrada(pdf, ordenadas[i].id, {
          x, y, cellW, cellH, pad, evento, logoData,
          numero: ordenadas[i].numero
        });

        // Progreso visual cada 50 entradas
        if (i % 50 === 0) {
          $("btn-pdf").textContent = `Generando PDF... ${i + 1}/${ordenadas.length}`;
        }
      }

      $("btn-pdf").textContent = "Guardando PDF...";
      pdf.save(`entradas_${(evento).replace(/\s+/g,'_').replace(/[^a-zA-Z0-9_áéíóúñÁÉÍÓÚÑ]/g,'').toLowerCase()}.pdf`);
    } catch (err) {
      alert("Error generando PDF: " + err.message);
      console.error(err);
    } finally {
      $("btn-pdf").disabled = false;
      $("btn-pdf").textContent = "\uD83D\uDCC4 Descargar PDF imprimible";
    }
  });

  // ============================================================
  //  Dibuja UNA celda de entrada compacta (~97mm × ~56mm)
  // ============================================================
  async function dibujarCeldaEntrada(pdf, codigo, opt) {
    const { x, y, cellW, cellH, pad, evento, logoData, numero } = opt;

    // --- Borde discontinuo para recortar ---
    pdf.setDrawColor(180, 180, 180);
    pdf.setLineWidth(0.3);
    pdf.setLineDashPattern([2, 2], 0);
    pdf.rect(x, y, cellW, cellH);
    pdf.setLineDashPattern([], 0);

    // --- Área interior con padding ---
    const ix = x + pad;
    const iy = y + pad;
    const iw = cellW - 2 * pad;
    const ih = cellH - 2 * pad;

    // ~~~ FILA SUPERIOR: Logo + Nombre evento + Nº (~14mm) ~~~
    const headerH = 14;
    let logoEndX = ix;

    if (logoData && logoData.dataURL) {
      const maxLogoH = 12, maxLogoW = 28;
      const ratio = logoData.w / logoData.h;
      let drawH = maxLogoH, drawW = maxLogoH * ratio;
      if (drawW > maxLogoW) { drawW = maxLogoW; drawH = maxLogoW / ratio; }
      const logoY = iy + (headerH - drawH) / 2;
      pdf.addImage(logoData.dataURL, "PNG", ix, logoY, drawW, drawH, undefined, "FAST");
      logoEndX = ix + drawW + 2;
    }

    // Nombre del evento a la derecha del logo
    pdf.setFont("helvetica", "bold");
    pdf.setFontSize(7.5);
    pdf.setTextColor(40, 60, 110);
    const maxTextW = iw - (logoEndX - ix) - 20;
    const lineas = pdf.splitTextToSize(evento, maxTextW);
    const textoY = iy + headerH / 2 - (lineas.length * 3) / 2 + 3;
    pdf.text(lineas, logoEndX + 1, textoY);

    // ★ Número de entrada (esquina superior derecha de la celda)
    if (numero) {
      pdf.setFont("helvetica", "bold");
      pdf.setFontSize(14);
      pdf.setTextColor(40, 60, 110);
      pdf.text("n\u00BA " + numero, ix + iw - 2, iy + 5, { align: "right" });
      pdf.setFontSize(5.5);
      pdf.setFont("helvetica", "normal");
      pdf.setTextColor(120, 120, 120);
      pdf.text("ENTRADA", ix + iw - 2, iy + 9, { align: "right" });
    }

    // Línea separadora
    const sepY = iy + headerH;
    pdf.setDrawColor(40, 60, 110);
    pdf.setLineWidth(0.2);
    pdf.line(ix + 2, sepY, ix + iw - 2, sepY);

    // ~~~ ZONA CENTRAL: QR + Código ~~~
    const qrSize = 28;
    const qrX = ix + (iw - qrSize) / 2;
    const qrY = sepY + 2;

    const qrDataURL = await generarQRDataURL(codigo, 256);
    pdf.addImage(qrDataURL, "PNG", qrX, qrY, qrSize, qrSize);

    // Código debajo del QR
    pdf.setFont("courier", "bold");
    pdf.setFontSize(9);
    pdf.setTextColor(100, 100, 100);
    pdf.text(codigo, ix + iw / 2, qrY + qrSize + 4, { align: "center" });

    // ~~~ PIE: "Una entrada, una persona" ~~~
    const footY = iy + ih - 1;
    pdf.setFont("helvetica", "normal");
    pdf.setFontSize(5.5);
    pdf.setTextColor(140, 140, 140);
    pdf.text("Una entrada, una persona \u00B7 Presenta este c\u00F3digo al entrar", ix + iw / 2, footY, { align: "center" });
  }

  // ============================================================
  //  Utilidades
  // ============================================================
  function cargarScript(src) {
    return new Promise((resolve, reject) => {
      if (document.querySelector(`script[src="${src}"]`)) return resolve();
      const s = document.createElement("script");
      s.src = src; s.onload = resolve; s.onerror = reject;
      document.head.appendChild(s);
    });
  }

  async function cargarLogoComoDataURL(url, maxPx = 400) {
    if (!url) return null;
    try {
      const r = await fetch(url, { cache: "no-store" });
      if (!r.ok) throw new Error("fetch no ok");
      const blob = await r.blob();
      const objURL = URL.createObjectURL(blob);
      const img = new Image();
      await new Promise((res, rej) => {
        img.onload = res;
        img.onerror = rej;
        img.src = objURL;
      });
      const origW = img.naturalWidth, origH = img.naturalHeight;
      const scale = Math.min(maxPx / origW, maxPx / origH, 1);
      const w = Math.max(1, Math.round(origW * scale));
      const h = Math.max(1, Math.round(origH * scale));
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const dataURL = canvas.toDataURL('image/png');
      URL.revokeObjectURL(objURL);
      return { dataURL, w: origW, h: origH };
    } catch (e) {
      console.warn('Fetch del logo falló, intentando img con crossOrigin...', e);
      try {
        const img = new Image();
        img.crossOrigin = "anonymous";
        await new Promise((res, rej) => {
          img.onload = res;
          img.onerror = rej;
          img.src = url;
        });
        const origW = img.naturalWidth, origH = img.naturalHeight;
        const scale = Math.min(maxPx / origW, maxPx / origH, 1);
        const w = Math.max(1, Math.round(origW * scale));
        const h = Math.max(1, Math.round(origH * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const dataURL = canvas.toDataURL('image/png');
        return { dataURL, w: origW, h: origH };
      } catch (e2) {
        console.warn('No se pudo cargar logo. Usa LOGO_BASE64 en config.js:', e2);
        return null;
      }
    }
  }

  function generarQRDataURL(texto, size) {
    return new Promise((resolve) => {
      const div = document.createElement("div");
      div.style.display = "none";
      document.body.appendChild(div);
      new QRCode(div, {
        text: texto, width: size, height: size,
        correctLevel: QRCode.CorrectLevel.H
      });
      setTimeout(() => {
        const img = div.querySelector("img");
        const canvas = div.querySelector("canvas");
        const dataURL = img ? img.src : canvas.toDataURL("image/png");
        document.body.removeChild(div);
        resolve(dataURL);
      }, 50);
    });
  }
</script>

</body>
</html>
